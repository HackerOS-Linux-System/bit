name: Build bit

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Bit.hk"
      - "scripts/bootstrap-ci.sh"
      - ".github/workflows/build.yml"
    tags: ["v*"]
  pull_request:
    paths:
      - "src/**"
      - "Bit.hk"
      - "scripts/bootstrap-ci.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build bit (release, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable   # hk-parser's native part

      # H# comes from the official install scripts of the H-Sharp repository
      # (install-utils.sh + install.sh); hk-parser, progress-bar and nidus from bit.io.
      - name: Install H# and bit's libraries
        run: bash scripts/bootstrap-ci.sh

      - name: Static-linking rule (no `extern dynamic` in bit's sources)
        run: |
          if grep -rIn --include='*.h#' 'extern dynamic' src; then
            echo "::error::bit links statically - use extern static"; exit 1
          fi

      - name: Build
        run: |
          mkdir -p cache/build/release
          'h#' compile src/main.h# -o cache/build/release/bit --release --verbose

      - name: Smoke test
        run: |
          set -e
          ./cache/build/release/bit --version
          ./cache/build/release/bit help | head -5
          file cache/build/release/bit
          if ldd cache/build/release/bit >/dev/null 2>&1; then
            echo "::warning::cache/build/release/bit is dynamically linked:"; ldd cache/build/release/bit
          else
            echo "bit is statically linked"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: bit-linux-x86_64
          path: cache/build/release/bit
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach binary to the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bit-linux-x86_64
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x bit
          gh release create "$GITHUB_REF_NAME" bit --repo "$GITHUB_REPOSITORY" --generate-notes || \
            gh release upload "$GITHUB_REF_NAME" bit --repo "$GITHUB_REPOSITORY" --clobber
