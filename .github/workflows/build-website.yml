name: Build & deploy website (bit.io)

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "index/**"
      - "images/**"
      - "scripts/validate-index.lua"
      - "scripts/common.lua"
      - ".github/workflows/build-website.yml"
  pull_request:
    paths:
      - "website/**"
      - "index/**"
      - "images/**"
      - "scripts/validate-index.lua"
      - "scripts/common.lua"
      - ".github/workflows/build-website.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push replaces a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate-index:
    name: Validate index/repository.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the pin policy compares against the base revision
      - name: Strict JSON + schema checks
        run: |
          set -euo pipefail
          f=index/repository.json
          # strict parse: catches trailing commas and other hand-editing slips
          jq -e . "$f" > /dev/null
          jq -e '.libraries | type == "array" and length > 0' "$f" > /dev/null

          echo "Required fields (name, target, description):"
          bad=$(jq -r '.libraries[] | select((.name // "") == "" or (.target // "") == "" or (.description // "") == "") | .name // "<no name>"' "$f")
          if [ -n "$bad" ]; then echo "::error::entries missing name/target/description:"; echo "$bad"; exit 1; fi

          echo "Names must be valid (letters, digits, - _ .) and unique:"
          jq -r '.libraries[].name' "$f" | grep -Ev '^[A-Za-z0-9][A-Za-z0-9._-]{0,63}$' && { echo "::error::invalid library name(s) above"; exit 1; } || true
          dup=$(jq -r '.libraries[].name | ascii_downcase' "$f" | sort | uniq -d)
          if [ -n "$dup" ]; then echo "::error::duplicate names:"; echo "$dup"; exit 1; fi

          echo "Targets must be https:// URLs:"
          jq -r '.libraries[].target' "$f" | grep -Ev '^https://' && { echo "::error::non-https target(s) above"; exit 1; } || true

          echo "Optional lang must be hsharp | hackerlang | hackerscript:"
          jq -r '.libraries[] | select(.lang != null) | select(.lang | IN("hsharp","hackerlang","hackerscript") | not) | .name' "$f" | grep . && { echo "::error::invalid lang on the entries above"; exit 1; } || true

          echo "OK: $(jq '.libraries | length' "$f") libraries"

      - name: Install lua
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      # New entries (and entries whose target changed) must be pinned to a tag or a
      # full commit id; existing unpinned entries only warn.
      - name: Pin policy (scripts/validate-index.lua)
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: lua5.4 scripts/validate-index.lua

  build:
    name: Build (HackerScript, mode:website) & test
    runs-on: ubuntu-latest
    needs: validate-index
    env:
      # absolute URLs in lib/<name>.html (canonical, og:*) and sitemap.xml
      SITE_URL: https://bit.io
      BIT_URL: https://github.com/HackerOS-Linux-System/bit/releases/download/v0.3/bit
      HACKERC_URL: https://github.com/HackerOS-Linux-System/HackerScript/releases/download/v0.6/hackerc
    steps:
      - uses: actions/checkout@v4

      # The site is written in HackerScript (website/cmd/*.hcs, `use <mode:website>`; no JavaScript, no TypeScript).
      # hackerc compiles it; bit runs the project's `site` command (see Bit.hk).
      - name: Download bit v0.3 and hackerc v0.6
        run: |
          set -euo pipefail
          bin="$HOME/.local/bin"
          mkdir -p "$bin"
          for pair in "bit|$BIT_URL" "hackerc|$HACKERC_URL"; do
            name="${pair%%|*}"
            url="${pair#*|}"
            echo "Downloading $name from $url"
            if ! curl -fsSL --retry 3 --retry-delay 2 -o "$bin/$name" "$url"; then
              echo "::error::could not download $name from $url (does the release asset exist?)"
              exit 1
            fi
            # a failed download must never be mistaken for a binary
            test "$(stat -c %s "$bin/$name")" -gt 100000 || { echo "::error::$name is suspiciously small - not a binary"; head -c 200 "$bin/$name"; exit 1; }
            chmod +x "$bin/$name"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: Show tool versions
        run: |
          hackerc --version
          bit --version

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install test dependencies (jsdom)
        working-directory: website
        run: npm ci --no-audit --no-fund

      # `bit site` = `bash website/scripts/build.sh` (Bit.hk [commands]):
      # hackerc website cmd/{index,lib,about,settings}.hcs -> dist/*.html + *.js,
      # then sw.js + 404/offline pages + index + images + lib/<name>.html + sitemap.xml + robots.txt.
      - name: Build the site (bit site)
        run: bit site

      - name: Unit tests (jsdom, compiled HackerScript)
        working-directory: website
        run: npm test

      - name: Sanity-check the build output
        working-directory: website
        run: |
          set -e
          for f in index.html lib.html about.html settings.html 404.html offline.html sw.js \
                   home.js lib.js about.js settings.js repository.json images/icon.png sitemap.xml; do
            test -s "dist/$f" || { echo "::error::missing dist/$f"; exit 1; }
          done
          # every page must load its own script, not the compiler's default app.js
          for p in index:home lib:lib about:about settings:settings; do
            grep -q "src=\"${p#*:}.js\"" "dist/${p%%:*}.html" || { echo "::error::${p%%:*}.html does not load ${p#*:}.js"; exit 1; }
          done
          test "$(ls dist/lib | wc -l)" -ge 1 || { echo "::error::no lib/<name>.html pages generated"; exit 1; }
          ! grep -n 'localhost' dist/*.js || { echo "::error::localhost reference in build"; exit 1; }
          du -sh dist

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: bit-io-preview
          path: website/dist
          retention-days: 7

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
