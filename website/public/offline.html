<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — bit.io</title>
  <style>
    body{font:16px/1.6 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;background:#0e0e13;color:#f0f0f5;text-align:center;padding:24px}
    h1{font-size:2.2rem;margin:0 0 8px;background:linear-gradient(135deg,#7c4dff,#ec4899,#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
    p{color:#c2c2cf;max-width:460px;margin:0 auto 18px}
    a,button{display:inline-block;margin:4px;padding:8px 16px;border-radius:10px;border:1px solid #2a2a34;background:#17171f;color:#f0f0f5;font:inherit;cursor:pointer;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>No internet connection</h1>
    <p>This page hasn't been saved in your browser yet. Libraries and pages you opened before work offline — try the index.</p>
    <a href="index.html">Go to the index</a><button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
